            for (const [keyword, advice] of Object.entries(adviceDatabase.keywords)) {
                if (input.includes(keyword)) {
                    return { text: advice, author: "给你的建议", source: "本地智能开导" };
                }
            }
            const randomIndex = Math.floor(Math.random() * adviceDatabase.default.length);
            return { text: adviceDatabase.default[randomIndex], author: "给你的建议", source: "本地智能开导" };
        }

        // 在线API获取寄语（一言 hitokoto.cn，免费无需key，带超时）
        async function fetchOnlineQuote(mood) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000); // 4秒超时

                const response = await fetch('https://v1.hitokoto.cn/?encode=json&max_length=60&c=' + getQuoteTag(mood), {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.hitokoto) {
                        return {
                            text: data.hitokoto,
                            author: data.from_who || data.from || "",
                            source: "一言 API"
                        };
                    }
                }
                throw new Error('API返回为空');
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('在线API请求超时，使用本地语库');
                } else {
                    console.log('在线API获取失败:', error.message);
                }
                return null;
            }
        }

        // 根据心情获取对应的分类（一言API：a动画 b漫画 d文学 j诗词 k哲学 e原创）
        function getQuoteTag(mood) {
            const tagMap = {
                'happy': 'a,e',
                'sad': 'd,k',
                'anxious': 'k,j',
                'tired': 'd,e',
                'excited': 'a,b',
                'confused': 'k,d',
                'daily': 'd,k'
            };
            return tagMap[mood] || 'd,k';
        }

        function findSimilarCities(input) {
            const inputLower = input.toLowerCase();
            const similarities = majorCities.map(city => {
                let score = 0;
                const cityLower = city.toLowerCase();
                if (cityLower.includes(inputLower) || inputLower.includes(cityLower)) {
                    score = 3;
                } else if (inputLower.length > 0 && cityLower.includes(inputLower[0])) {
                    score = 1;
                }
                return { city, score };
            }).filter(item => item.score > 0)
              .sort((a, b) => b.score - a.score)
              .slice(0, 6)
              .map(item => item.city);
            return similarities;
        }

        async function getWeatherAndQuote() {
            const city = document.getElementById('city').value.trim();
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('errorMessage');
            const citySuggestion = document.getElementById('citySuggestion');

            resultDiv.classList.remove('show');
            errorDiv.classList.remove('show');
            citySuggestion.classList.remove('show');

            if (!city) {
                showError('请输入城市名称');
                return;
            }

            if (!selectedMood) {
                showError('请选择您的心情');
                return;
            }

            if (selectedMood === 'custom' && !customMoodText) {
                showError('请告诉我们您的心情');
                return;
            }

            loadingDiv.classList.add('show');

            try {
                let weatherData = null;
                let displayCity = city;
                let nearestCityInfo = null;

                // 首先尝试直接从数据库获取天气
                weatherData = await getWeatherData(city);

                // 如果数据库中没有该城市，尝试通过地理编码API获取坐标
                if (!weatherData) {
                    console.log('尝试通过地理编码API查找城市:', city);
                    const geoCoords = await getCityCoordinates(city);

                    if (geoCoords) {
                        console.log('找到城市坐标:', geoCoords);
                        // 找到距离该城市最近的数据库中的城市
                        nearestCityInfo = findNearestCity(geoCoords.lat, geoCoords.lon);
                        console.log('最近城市:', nearestCityInfo);

                        if (nearestCityInfo) {
                            // 获取最近城市的天气数据
                            weatherData = await getWeatherData(nearestCityInfo.name);
                            if (weatherData) {
                                weatherData.actualCity = nearestCityInfo.name;
                                weatherData.isNearestCity = true;
                                weatherData.distance = nearestCityInfo.distance;
                                weatherData.inputCity = city;
                            }
                        }
                    }
                }

                // 并行请求：天气和寄语同时获取
                const quotePromise = getQuoteData(selectedMood, customMoodText);
                const quote = await quotePromise;

                // 检查天气数据
                if (!weatherData) {
                    loadingDiv.classList.remove('show');
                    const similarCities = findSimilarCities(city);
                    if (similarCities.length > 0) {
                        showCitySuggestions(similarCities);
                    } else {
                        showError('无法获取天气信息，请检查城市名称是否正确');
                    }
                    return;
                }

                // 显示城市名称（如果是最近城市，显示提示）
                if (weatherData.isNearestCity) {
                    const distanceText = weatherData.distance < 1 ?
                        `${Math.round(weatherData.distance * 1000)}米` :
                        `${Math.round(weatherData.distance)}公里`;
                    document.getElementById('cityName').textContent =
                        `${weatherData.inputCity} (显示${weatherData.actualCity}天气, 距离${distanceText})`;
                } else {
                    document.getElementById('cityName').textContent = displayCity;
                }

                document.getElementById('temperature').textContent = `${weatherData.temp_C}°C`;
                document.getElementById('weatherDesc').textContent = weatherData.weatherDesc;
                document.getElementById('humidity').textContent = `${weatherData.humidity}%`;
                document.getElementById('windSpeed').textContent = `${weatherData.windSpeed} km/h`;
                document.getElementById('feelsLike').textContent = `${weatherData.feelsLike}°C`;

                // 显示寄语
                document.getElementById('quoteText').textContent = `"${quote.text}"`;

                const authorElement = document.getElementById('quoteAuthor');
                if (quote.author) {
                    authorElement.textContent = `—— ${quote.author}`;
                    authorElement.style.display = 'block';
                } else {
                    authorElement.style.display = 'none';
                }

                const sourceElement = document.getElementById('quoteSource');
                sourceElement.textContent = `来源: ${quote.source}`;
                sourceElement.style.display = 'block';

                loadingDiv.classList.remove('show');
                resultDiv.classList.add('show');

            } catch (error) {
                loadingDiv.classList.remove('show');
                const similarCities = findSimilarCities(city);
                if (similarCities.length > 0) {
                    showCitySuggestions(similarCities);
                } else {
                    showError(error.message || '获取信息失败，请稍后重试');
                }
            }
        }

        // 计算两个坐标之间的距离（Haversine公式，单位：千米）
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球半径，单位：千米
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // 查找距离指定坐标最近的城市
        function findNearestCity(targetLat, targetLon) {
            let nearestCity = null;
            let minDistance = Infinity;

            for (const [cityName, coords] of Object.entries(cityCoordinates)) {
                const distance = calculateDistance(targetLat, targetLon, coords.lat, coords.lon);
                if (distance < minDistance) {
                    minDistance = distance;
                    nearestCity = { name: cityName, distance: distance };
                }
            }

            return nearestCity;
        }

        // 使用 Open-Meteo API 获取天气数据
        async function getWeatherData(city) {
            // 检查缓存
            const cached = cachedWeather[city];
            const now = Date.now();
            if (cached && (now - cached.timestamp) < WEATHER_CACHE_DURATION) {
                console.log('使用缓存的天气数据');
                return cached.data;
            }

            // 获取城市坐标
            let coords = cityCoordinates[city];
            let actualCity = city;
            let isNearestCity = false;

            if (!coords) {
                console.log('未找到城市坐标:', city);
                return null;
            }

            try {
                // 添加超时控制
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000); // 8秒超时

                // 使用 Open-Meteo API (免费，无需API key)
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&wind_speed_unit=kmh&timezone=auto`;

                const response = await fetch(url, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    const current = data.current;

                    const weatherData = {
                        temp_C: Math.round(current.temperature_2m),
                        weatherDesc: weatherCodeMap[current.weather_code] || '未知',
                        humidity: current.relative_humidity_2m,
                        windSpeed: Math.round(current.wind_speed_10m),
                        feelsLike: Math.round(current.apparent_temperature),
                        actualCity: actualCity,
                        isNearestCity: isNearestCity
                    };

                    // 缓存数据
                    cachedWeather[city] = {
                        data: weatherData,
                        timestamp: now
                    };

                    return weatherData;
                }
                return null;
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('天气请求超时');
                }
                // 如果有缓存数据，即使过期也返回
                if (cached) {
                    console.log('使用过期的缓存数据');
                    return cached.data;
                }
                throw error;
            }
        }

        // 尝试通过地理编码API获取城市坐标
        async function getCityCoordinates(city) {
            try {
                // 使用Open-Meteo的地理编码API（免费，无需API key）
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000); // 3秒超时

                const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=zh&format=json`;

                const response = await fetch(url, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    if (data.results && data.results.length > 0) {
                        const result = data.results[0];
                        return {
                            lat: result.latitude,
                            lon: result.longitude,
                            name: result.name,
                            country: result.country
                        };
                    }
                }
                return null;
            } catch (error) {
                console.log('获取城市坐标失败:', error.message);
                return null;
            }
        }
